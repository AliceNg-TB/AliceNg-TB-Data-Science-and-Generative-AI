<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- ========== TB Logo 漸層 ========== -->
    <linearGradient id="tbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>
    
    <!-- 原有漸層定義 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B026FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0.2" />
    </linearGradient>

    <!-- 濾鏡定義 (發光效果) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#00F0FF" />
    </marker>

    <!-- 背景網格 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="1.5" fill="#334155" />
    </pattern>

    <!-- 動畫關鍵影格 -->
    <style>
      .rotate { animation: spin 10s linear infinite; transform-origin: center; }
      .rotate-reverse { animation: spin-reverse 12s linear infinite; transform-origin: center; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .pulse-fast { animation: pulse 1s ease-in-out infinite; }
      .flow { animation: dash 1s linear infinite; }
      .flow-slow { animation: dash 2s linear infinite; }
      .blink { animation: blink 1s step-end infinite; }
      .glow-text { animation: textGlow 3s ease-in-out infinite alternate; }
      .draw-chart { animation: draw 1.5s ease-out forwards; }

      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
      @keyframes pulse { 
        0% { opacity: 0.6; transform: scale(1); } 
        50% { opacity: 1; transform: scale(1.05); } 
        100% { opacity: 0.6; transform: scale(1); } 
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes textGlow {
        0% { fill: #94A3B8; }
        100% { fill: #00F0FF; }
      }
      @keyframes draw {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }
      .node-rect {
        transition: all 0.3s ease;
      }
      .node-rect:hover {
        transform: translateY(-4px);
        filter: url(#neonGlow);
      }
    </style>
  </defs>
